name: Cloud Video Render
on:
  workflow_dispatch:
    inputs:
      project_id:
        required: true
      topic:
        required: true
      voice_id:
        default: "en-US-AndrewNeural"
      aspect_ratio:
        default: "16:9"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          cd worker/video-engine && npm install
          pip install google-genai edge-tts faster-whisper pydantic supabase requests

      - name: Generate AI Script & Word-Synced Audio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: python worker/pipeline.py "${{ github.event.inputs.project_id }}" "${{ github.event.inputs.topic }}" "${{ github.event.inputs.voice_id }}" "${{ github.event.inputs.aspect_ratio }}"

      - name: Render 60fps MP4
        run: cd worker/video-engine && npx remotion render src/index.ts ExplainerVideo out/video.mp4

      - name: Upload MP4 to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: python worker/upload_video.py "${{ github.event.inputs.project_id }}"